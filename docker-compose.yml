name: nexo-assist

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo_assist
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env da raiz}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo_assist"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3333}:3333"
    environment:
      NODE_ENV: development
      PORT: 3333
      CORS_ORIGIN: http://localhost:${FRONT_PORT:-3000}
      DATABASE_URL: postgresql://nexo:${POSTGRES_PASSWORD}@db:5432/nexo_assist
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Defina JWT_ACCESS_SECRET no .env da raiz}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - src/generated/
            - .env
        - action: rebuild
          path: ./backend/package-lock.json
        - action: rebuild
          path: ./backend/prisma/schema.prisma

  front:
    build:
      context: ./front
      target: dev
    init: true
    ports:
      - "127.0.0.1:${FRONT_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-3333}/api
      NEXT_DEV_FS_CACHE: "false"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync+restart
          path: ./front/src/app/globals.css
          target: /app/src/app/globals.css
        - action: sync
          path: ./front
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./front/package-lock.json

volumes:
  db-data:
